# This holds the sensitive settings the app needs — same idea as
# 02-postgres-secret.yaml (values are base64-encoded, not encrypted —
# see the notes in that file for how to make your own values, or use
# the "kubectl create secret" command shown in DEPLOYMENT.md instead of
# editing this file by hand).
#
# The placeholder DATABASE_URL below matches the placeholder username/
# password from 02-postgres-secret.yaml, and points at the "postgres"
# Service (05-postgres-service.yaml) by name — that's how the app finds
# the database inside the cluster.
#
# SENDGRID_API_KEY, SENDGRID_FROM_EMAIL, CLOUDINARY_* and CRON_SECRET
# are left blank on purpose. Leaving SendGrid/Cloudinary blank is fine —
# the app falls back to printing emails to its logs and saving files to
# local disk instead (see the main README). Fill these in later once you
# have real accounts for them.

apiVersion: v1
kind: Secret
metadata:
  name: app-secret
  namespace: receptro
type: Opaque
data:
  DATABASE_URL: cG9zdGdyZXNxbDovL3JlY2VwdHJvOnJlY2VwdHJvX3Bhc3N3b3JkQHBvc3RncmVzOjU0MzIvcmVjZXB0cm8=
  JWT_SECRET: cGxlYXNlLWNoYW5nZS10aGlzLXRvLWEtbG9uZy1yYW5kb20tc3RyaW5n
  SENDGRID_API_KEY: ""
  SENDGRID_FROM_EMAIL: ""
  CLOUDINARY_CLOUD_NAME: ""
  CLOUDINARY_API_KEY: ""
  CLOUDINARY_API_SECRET: ""
  CRON_SECRET: ""
