# This runs the actual Receptro app containers.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: receptro-app
  namespace: receptro
spec:
  # Running 2 copies means if one crashes or is being updated, the other
  # one is still serving users. Turn this down to 1 if you're just
  # testing on a small local cluster like Minikube or Kind.
  replicas: 2
  selector:
    matchLabels:
      app: receptro-app
  template:
    metadata:
      labels:
        app: receptro-app
    spec:
      containers:
        - name: receptro-app
          # CHANGE THIS to point at your own image once you've built and
          # pushed it somewhere (Docker Hub, GitHub Container Registry,
          # etc). See DEPLOYMENT.md for the build/push commands.
          # Example: yourusername/receptro:latest
          image: your-registry-username/receptro:latest
          ports:
            - containerPort: 3000
          # Non-secret settings come from the ConfigMap...
          envFrom:
            - configMapRef:
                name: app-config
            # ...and secret settings come from the Secret. Both get
            # loaded in as environment variables inside the container.
            - secretRef:
                name: app-secret
          # Kubernetes hits this URL to check "has the app actually
          # finished starting up yet?" before sending it real traffic.
          readinessProbe:
            httpGet:
              path: /login
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          # Kubernetes hits this URL every so often to check "is the app
          # still working?". If this starts failing, Kubernetes restarts
          # the container automatically.
          livenessProbe:
            httpGet:
              path: /login
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 20
          # A sensible starting point for how much CPU/memory to give
          # each copy of the app. Adjust based on what you actually see
          # it using once it's running.
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
