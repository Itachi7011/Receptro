# An "Ingress" is what lets people out on the real internet reach your
# app using a normal web address, instead of you having to manually
# forward ports. This step needs an "Ingress Controller" already running
# in your cluster (like ingress-nginx) — most managed Kubernetes
# providers (GKE, EKS, AKS, DigitalOcean) have an easy way to install
# one if you don't have one yet.
#
# For local testing (Minikube, Kind, Docker Desktop), you likely don't
# need this file at all — see DEPLOYMENT.md for the simpler
# "kubectl port-forward" way of reaching the app instead.

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: receptro-ingress
  namespace: receptro
  annotations:
    # Ask the ingress controller to redirect http:// requests to https://
    # automatically. Remove this line if you haven't set up HTTPS yet.
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  rules:
    # CHANGE THIS to your real domain name once you have one. Until
    # then, this is just a placeholder.
    - host: receptro.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: receptro-app
                port:
                  number: 80
