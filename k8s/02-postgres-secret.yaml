# A "Secret" is where passwords and other sensitive values live in
# Kubernetes (instead of putting them in plain sight in a normal config
# file).
#
# IMPORTANT: The values below are NOT stored as plain text — Kubernetes
# Secrets expect values written in "base64", which is not real
# encryption, just a way of encoding text. Anyone who can read this
# Secret can decode it back to plain text easily. Treat this file as if
# it contains real passwords, and don't commit your real, filled-in
# version of this file to a public Git repo.
#
# The placeholder values below decode to:
#   username: receptro
#   password: receptro_password
#
# To make your OWN values, run this on your computer and swap in your
# own password:
#
#   echo -n "your-own-password-here" | base64
#
# Then paste the result in place of the "password" value below.
#
# (There's also a simpler way that skips editing this file entirely —
# see the "kubectl create secret" command in DEPLOYMENT.md.)

apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: receptro
type: Opaque
data:
  POSTGRES_USER: cmVjZXB0cm8=
  POSTGRES_PASSWORD: cmVjZXB0cm9fcGFzc3dvcmQ=
  POSTGRES_DB: cmVjZXB0cm8=
